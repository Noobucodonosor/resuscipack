<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" role="img" aria-labelledby="svg-title">
  <title id="svg-title">Le operazioni fondamentali, il resto euclideo e la proprietà distributiva</title>
  <style>
    .title { font: 600 15px Georgia, "Times New Roman", serif; fill: #1f2421; }
    .label { font: 500 13px Georgia, "Times New Roman", serif; fill: #1f2421; }
    .math { font: italic 600 14px Georgia, "Times New Roman", serif; fill: #2c4f7c; }
    .muted { font: 400 11.5px -apple-system, BlinkMacSystemFont, sans-serif; fill: #5d645f; }
  </style>
  <rect x="1" y="1" width="718" height="242" rx="8" fill="#faf7f2" stroke="#d9d2c5" stroke-width="1.5"/>
  <text x="360" y="34" text-anchor="middle" class="title">Legge distributiva come scomposizione geometrica di aree</text>
  <rect x="140" y="68" width="240" height="120" fill="#2c4f7c" fill-opacity="0.14" stroke="#2c4f7c" stroke-width="1.8"/>
  <rect x="380" y="68" width="170" height="120" fill="#b86b2b" fill-opacity="0.16" stroke="#b86b2b" stroke-width="1.8"/>
  <text x="122" y="132" text-anchor="end" class="math">a</text>
  <text x="260" y="58" text-anchor="middle" class="math">b</text>
  <text x="465" y="58" text-anchor="middle" class="math">c</text>
  <text x="260" y="134" text-anchor="middle" class="math">a · b</text>
  <text x="465" y="134" text-anchor="middle" class="math">a · c</text>
  <text x="345" y="220" text-anchor="middle" class="math">a(b + c) = ab + ac</text>
</svg>
