<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="svg-title">
  <title id="svg-title">Dai numeri primi alle frazioni, ai decimali e ai numeri con segno</title>
  <style>
    .title { font: 600 15px Georgia, "Times New Roman", serif; fill: #1f2421; }
    .label { font: 500 13px Georgia, "Times New Roman", serif; fill: #1f2421; }
    .math { font: italic 600 14px Georgia, "Times New Roman", serif; fill: #2c4f7c; }
    .muted { font: 400 11.5px -apple-system, BlinkMacSystemFont, sans-serif; fill: #5d645f; }
  </style>
  <rect x="1" y="1" width="718" height="248" rx="8" fill="#faf7f2" stroke="#d9d2c5" stroke-width="1.5"/>
  <text x="360" y="30" text-anchor="middle" class="title">Dai numeri primi alle frazioni, ai decimali e ai numeri con segno</text>
  <rect x="70" y="56" width="290" height="28" rx="4" fill="#2c4f7c" fill-opacity="0.16" stroke="#2c4f7c"/>
  <line x1="215" y1="56" x2="215" y2="84" stroke="#2c4f7c" stroke-width="1.5"/>
  <rect x="70" y="92" width="290" height="28" rx="4" fill="#b86b2b" fill-opacity="0.16" stroke="#b86b2b"/>
  <line x1="142.5" y1="92" x2="142.5" y2="120" stroke="#b86b2b" stroke-width="1.2"/>
  <line x1="215" y1="92" x2="215" y2="120" stroke="#b86b2b" stroke-width="1.2"/>
  <line x1="287.5" y1="92" x2="287.5" y2="120" stroke="#b86b2b" stroke-width="1.2"/>
  <text x="378" y="75" class="math">1/2 = 2/4 = 3/6</text>
  <text x="378" y="111" class="muted">Parti equivalenti dello stesso intero</text>
  <line x1="80" y1="176" x2="640" y2="176" stroke="#1f2421" stroke-width="1.8"/>
  <polygon points="640,176 630,171 630,181" fill="#1f2421"/>
  <line x1="80" y1="176" x2="90" y2="171" stroke="#1f2421" stroke-width="1.4"/>
  <line x1="360" y1="166" x2="360" y2="186" stroke="#2d6a5b" stroke-width="2.2"/>
  <text x="360" y="204" text-anchor="middle" class="math">0</text>
  <line x1="160" y1="168" x2="160" y2="184" stroke="#1f2421"/><text x="160" y="204" text-anchor="middle" class="label">-2</text>
  <line x1="260" y1="168" x2="260" y2="184" stroke="#1f2421"/><text x="260" y="204" text-anchor="middle" class="label">-1</text>
  <line x1="460" y1="168" x2="460" y2="184" stroke="#1f2421"/><text x="460" y="204" text-anchor="middle" class="label">+1</text>
  <line x1="560" y1="168" x2="560" y2="184" stroke="#1f2421"/><text x="560" y="204" text-anchor="middle" class="label">+2</text>
  <circle cx="510" cy="176" r="5" fill="#b86b2b"/><text x="510" y="158" text-anchor="middle" class="math">3/2</text>
  <circle cx="210" cy="176" r="5" fill="#2c4f7c"/><text x="210" y="158" text-anchor="middle" class="math">-3/2</text>
  <text x="360" y="230" text-anchor="middle" class="muted">Densità dei razionali Q, segni orientati in Z e simmetria rispetto allo zero</text>
</svg>
