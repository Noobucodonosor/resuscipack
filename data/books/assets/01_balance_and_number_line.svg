<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="svg-title">
  <title id="svg-title">Dall&#x27;ovvio al numero: contare, ordinare e l&#x27;equilibrio dell&#x27;uguale</title>
  <style>
    .title { font: 600 15px Georgia, "Times New Roman", serif; fill: #1f2421; }
    .label { font: 500 13px Georgia, "Times New Roman", serif; fill: #1f2421; }
    .math { font: italic 600 14px Georgia, "Times New Roman", serif; fill: #2c4f7c; }
    .muted { font: 400 11.5px -apple-system, BlinkMacSystemFont, sans-serif; fill: #5d645f; }
  </style>
  <rect x="1" y="1" width="718" height="248" rx="8" fill="#faf7f2" stroke="#d9d2c5" stroke-width="1.5"/>
  <text x="190" y="34" text-anchor="middle" class="title">Contare per corrispondenza e ordine</text>
  <line x1="360" y1="26" x2="360" y2="234" stroke="#d9d2c5" stroke-width="1.2"/>
  <line x1="40" y1="174" x2="335" y2="174" stroke="#1f2421" stroke-width="1.8"/>
  <polygon points="335,174 326,169 326,179" fill="#1f2421"/>
  <line x1="58" y1="168" x2="58" y2="180" stroke="#1f2421" stroke-width="1.5"/>
  <text x="58" y="200" text-anchor="middle" class="label">0</text>
  <circle cx="83" cy="86" r="10" fill="#b86b2b" fill-opacity="0.18" stroke="#b86b2b" stroke-width="1.5"/>
  <line x1="83" y1="96" x2="108" y2="160" stroke="#2c4f7c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="108" y1="168" x2="108" y2="180" stroke="#1f2421" stroke-width="1.5"/>
  <text x="108" y="200" text-anchor="middle" class="label">1</text>
  <circle cx="128" cy="86" r="10" fill="#b86b2b" fill-opacity="0.18" stroke="#b86b2b" stroke-width="1.5"/>
  <line x1="128" y1="96" x2="158" y2="160" stroke="#2c4f7c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="158" y1="168" x2="158" y2="180" stroke="#1f2421" stroke-width="1.5"/>
  <text x="158" y="200" text-anchor="middle" class="label">2</text>
  <circle cx="173" cy="86" r="10" fill="#b86b2b" fill-opacity="0.18" stroke="#b86b2b" stroke-width="1.5"/>
  <line x1="173" y1="96" x2="208" y2="160" stroke="#2c4f7c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="208" y1="168" x2="208" y2="180" stroke="#1f2421" stroke-width="1.5"/>
  <text x="208" y="200" text-anchor="middle" class="label">3</text>
  <circle cx="218" cy="86" r="10" fill="#b86b2b" fill-opacity="0.18" stroke="#b86b2b" stroke-width="1.5"/>
  <line x1="218" y1="96" x2="258" y2="160" stroke="#2c4f7c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="258" y1="168" x2="258" y2="180" stroke="#1f2421" stroke-width="1.5"/>
  <text x="258" y="200" text-anchor="middle" class="label">4</text>
  <line x1="308" y1="168" x2="308" y2="180" stroke="#1f2421" stroke-width="1.5"/>
  <text x="308" y="200" text-anchor="middle" class="label">5</text>
  <text x="188" y="226" text-anchor="middle" class="muted">Ogni passo a destra aggiunge un successore (+1)</text>
  <text x="540" y="34" text-anchor="middle" class="title">L’uguale come equilibrio di bilancia</text>
  <line x1="540" y1="74" x2="540" y2="186" stroke="#1f2421" stroke-width="2.2"/>
  <polygon points="522,196 558,196 540,182" fill="#1f2421"/>
  <line x1="422" y1="94" x2="658" y2="94" stroke="#2c4f7c" stroke-width="3"/>
  <circle cx="540" cy="94" r="5" fill="#b86b2b"/>
  <line x1="440" y1="94" x2="424" y2="144" stroke="#5d645f" stroke-width="1.2"/>
  <line x1="440" y1="94" x2="456" y2="144" stroke="#5d645f" stroke-width="1.2"/>
  <rect x="408" y="144" width="64" height="10" rx="3" fill="#2c4f7c" fill-opacity="0.2" stroke="#2c4f7c"/>
  <text x="440" y="132" text-anchor="middle" class="math">3 + 4</text>
  <line x1="640" y1="94" x2="624" y2="144" stroke="#5d645f" stroke-width="1.2"/>
  <line x1="640" y1="94" x2="656" y2="144" stroke="#5d645f" stroke-width="1.2"/>
  <rect x="608" y="144" width="64" height="10" rx="3" fill="#b86b2b" fill-opacity="0.2" stroke="#b86b2b"/>
  <text x="640" y="132" text-anchor="middle" class="math">x + 2</text>
  <text x="540" y="226" text-anchor="middle" class="muted">Simmetria e invarianti: stessa operazione sui due piatti</text>
</svg>
