<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="svg-title">
  <title id="svg-title">Versionamento, testing sistematico, sicurezza web e modelli generativi</title>
  <style>
    .title { font: 600 15px Georgia, "Times New Roman", serif; fill: #1f2421; }
    .label { font: 500 13px Georgia, "Times New Roman", serif; fill: #1f2421; }
    .math { font: italic 600 14px Georgia, "Times New Roman", serif; fill: #2c4f7c; }
    .muted { font: 400 11.5px -apple-system, BlinkMacSystemFont, sans-serif; fill: #5d645f; }
  </style>
  <rect x="1" y="1" width="718" height="248" rx="8" fill="#faf7f2" stroke="#d9d2c5" stroke-width="1.5"/>
  <text x="360" y="32" text-anchor="middle" class="title">Versionamento, testing sistematico, sicurezza web e modelli generativi</text>
  <text x="195" y="58" text-anchor="middle" class="muted">Circuito in serie ↔ Congiunzione logica (A ∧ B)</text>
  <line x1="60" y1="104" x2="118" y2="104" stroke="#1f2421" stroke-width="2"/>
  <line x1="118" y1="104" x2="162" y2="82" stroke="#2c4f7c" stroke-width="2.4"/>
  <circle cx="118" cy="104" r="4" fill="#2c4f7c"/><circle cx="164" cy="104" r="4" fill="#2c4f7c"/>
  <text x="140" y="76" text-anchor="middle" class="math">A</text>
  <line x1="164" y1="104" x2="220" y2="104" stroke="#1f2421" stroke-width="2"/>
  <line x1="220" y1="104" x2="264" y2="104" stroke="#2d6a5b" stroke-width="2.4"/>
  <circle cx="220" cy="104" r="4" fill="#2d6a5b"/><circle cx="264" cy="104" r="4" fill="#2d6a5b"/>
  <text x="242" y="76" text-anchor="middle" class="math">B</text>
  <line x1="264" y1="104" x2="325" y2="104" stroke="#1f2421" stroke-width="2"/>
  <circle cx="332" cy="104" r="9" fill="#b86b2b" fill-opacity="0.22" stroke="#b86b2b" stroke-width="1.8"/>
  <text x="195" y="138" text-anchor="middle" class="label">Chiuso sse A = 1 ∧ B = 1</text>
  <line x1="365" y1="50" x2="365" y2="215" stroke="#d9d2c5" stroke-width="1.2"/>
  <text x="538" y="58" text-anchor="middle" class="muted">Circuito in parallelo ↔ Disgiunzione logica (A ∨ B)</text>
  <line x1="395" y1="104" x2="445" y2="104" stroke="#1f2421" stroke-width="2"/>
  <polyline points="445,104 445,78 485,78" fill="none" stroke="#1f2421" stroke-width="1.8"/>
  <line x1="485" y1="78" x2="530" y2="78" stroke="#2d6a5b" stroke-width="2.4"/>
  <polyline points="530,78 575,78 575,104" fill="none" stroke="#1f2421" stroke-width="1.8"/>
  <polyline points="445,104 445,132 485,132" fill="none" stroke="#1f2421" stroke-width="1.8"/>
  <line x1="485" y1="132" x2="526" y2="114" stroke="#2c4f7c" stroke-width="2.4"/>
  <polyline points="530,132 575,132 575,104" fill="none" stroke="#1f2421" stroke-width="1.8"/>
  <text x="508" y="70" text-anchor="middle" class="math">A</text>
  <text x="508" y="152" text-anchor="middle" class="math">B</text>
  <line x1="575" y1="104" x2="625" y2="104" stroke="#1f2421" stroke-width="2"/>
  <circle cx="634" cy="104" r="9" fill="#2d6a5b" fill-opacity="0.32" stroke="#2d6a5b" stroke-width="1.8"/>
  <text x="538" y="180" text-anchor="middle" class="label">Chiuso sse A = 1 ∨ B = 1</text>
  <text x="360" y="230" text-anchor="middle" class="muted">Isomorfismo booleano tra commutazione elettrica, algebra degli insiemi e tavola di verità</text>
</svg>
