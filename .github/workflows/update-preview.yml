name: Update Social Preview

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/preview/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies & build Vista Libro
        run: |
          pip install -r requirements.txt
          python3 scripts/export_static_book.py --out _site

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --prefix /tmp/pw-runner --no-save playwright
          /tmp/pw-runner/node_modules/.bin/playwright install chromium

      - name: Generate preview screenshots
        env:
          NODE_PATH: /tmp/pw-runner/node_modules
          PREVIEW_TARGET_URL: http://127.0.0.1:8765
          PREVIEW_OUT_DIR: docs/preview
          PREVIEW_BADGE: "VISTA LIBRO · LIVE"
          PREVIEW_TITLE: "resuscipack"
          PREVIEW_DESC: "Due volumi continui in 20 capitoli con formule KaTeX, diagrammi SVG, citazioni verificate su oltre 1.400 testi ed esercizi simbolici."
          PREVIEW_TAGS: "Vista Libro,20 Capitoli,KaTeX & SVG,Fonti Verificate,Python"
          PREVIEW_REPO: "github.com/Noobucodonosor/resuscipack"
          PREVIEW_LIVE_URL: "https://noobucodonosor.github.io/resuscipack"
          PREVIEW_THEME: "blue"
        run: |
          python3 -m http.server 8765 -d _site >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765 >/dev/null && break
            sleep 0.5
          done
          node .github/scripts/generate-preview.mjs

      - name: Commit and push updated previews
        run: |
          rm -rf _site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/preview/desktop.png docs/preview/mobile.png docs/preview/social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(preview): auto-update social preview [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No preview changes detected."
          fi
